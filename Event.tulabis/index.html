         background: #F8FAFC; color: #1E2833; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }

<body>
<!-- ============ Top header ============ -->
<header class="fixed top-0 inset-x-0 z-30 bg-navy text-white" style="background:#093D5E;color:#fff;padding-top:env(safe-area-inset-top)">
  <div class="max-w-xl mx-auto h-14 px-4 flex items-center justify-between">
    <div class="flex items-center gap-2 min-w-0">
      <svg width="32" height="32" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#FFFFFF" fill-opacity=".12"/><path d="M96 176a32 32 0 0 1 32-32h256a32 32 0 0 1 32 32v40a40 40 0 0 0 0 80v40a32 32 0 0 1-32 32H128a32 32 0 0 1-32-32v-40a40 40 0 0 0 0-80z" fill="#FFBE33"/><path d="M196 256l44 44 80-88" fill="none" stroke="#1E2833" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="min-w-0">
        <div class="font-bold leading-tight">OrgPass</div>

    </div>
    <span id="pill"></span>
  </div>
</header>

<!-- ============ Main view ============ -->
<main class="max-w-xl mx-auto px-4" style="padding-top:calc(4.5rem + env(safe-area-inset-top));padding-bottom:8rem"><div id="installSlot"></div><div id="view"></div></main>

<!-- ============ Bottom navigation ============ -->
<nav id="nav" class="fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 safe-bottom" style="background:#FFFFFF"></nav>

<!-- Floating UI -->
<div id="banner" class="fixed left-3 right-3 z-[70] max-w-xl mx-auto" style="top:calc(3.75rem + env(safe-area-inset-top))"></div>
<div id="toast" class="fixed left-3 right-3 z-[60] max-w-xl mx-auto" style="bottom:calc(5.5rem + env(safe-area-inset-bottom))"></div>
<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 overflow-auto" style="background:rgba(30,40,51,.78)"></div>
<div id="setup" class="hidden fixed inset-0 z-[80] overflow-auto" style="background:#093D5E"></div>

<script>
/* =====================================================================
   OrgPass — offline-first event check-in (Google Sheets backend)
   Sections: helpers · icons · state · sync · actions · views · boot
   ===================================================================== */

/* ---------- Helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s || '').toUpperCase().replace(/\s+/g, '');
const ROLES = ['Student', 'Speaker', 'Officer', 'Staff', 'Guest'];
const PLURAL = { Student: 'Students', Speaker: 'Speakers', Officer: 'Officers', Staff: 'Staff', Guest: 'Guests' };

function normRole(r) {
  const x = String(r || '').trim().toLowerCase().replace(/s$/, '');
  return ROLES.find((o) => o.toLowerCase().replace(/s$/, '') === x) || 'Guest';
}
function fmtTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}
function fmtStamp(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function todayStr() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function plusDays(n) {
  const d = new Date(); d.setDate(d.getDate() + n);
  const p = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function fmtDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  if (!m) return s || '';
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtClock(s) {
  const m = /^(\d{1,2}):(\d{2})/.exec(s || '');
  if (!m) return s || '';
  return new Date(2000, 0, 1, +m[1], +m[2]).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}
function genCode() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c;
  do {
    c = 'OP-' + Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join('');
  } while (S.guests.some((g) => norm(g.code) === norm(c)));
  return c;
}
const findByCode = (c) => S.guests.find((g) => norm(g.code) === c);
const activeEvent = () => S.events.find((e) => e.active);

/* ---------- Icons (inline SVG, no external files) ---------- */
const I = (p, s = 24) => `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC = {
  gauge: (s) => I('<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>', s),
  users: (s) => I('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>', s),
  scan: (s) => I('<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>', s),
  megaphone: (s) => I('<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>', s),
  more: (s) => I('<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>', s),
  qr: (s) => I('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M20 20h1v1"/>', s),
  x: (s) => I('<path d="M18 6 6 18M6 6l12 12"/>', s),
  search: (s) => I('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>', s),
  camera: (s) => I('<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>', s),
  refresh: (s) => I('<path d="M21 12a9 9 0 0 0-15.5-6.3L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.3L21 16"/><path d="M16 16h5v5"/>', s)
};

/* ---------- State (persisted in localStorage) ---------- */
const LS_KEY = 'orgpass_v1';
const DEFAULT_STATE = { officer: '', url: '', demo: false, guests: [], events: [], queue: [], lastSync: 0 };
let S = loadState();
function loadState() {
  try { return Object.assign({}, DEFAULT_STATE, JSON.parse(localStorage.getItem(LS_KEY) || '{}')); }
  catch (e) { return Object.assign({}, DEFAULT_STATE); }
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch (e) { toast('Storage is full — export attendance now.'); }
}

let ver = 0;                 // bumps on every local change (guards background pulls)
let syncing = false, netOk = true;
let tab = 'dashboard';
let roleFilter = 'All', statusFilter = 'All', attLimit = 100;
let query = '', walkinPrefill = '';
let formOpen = false;
let dashRole = 'All';        // which group the dashboard chart is showing

/* Demo / Offline Mode sample data (only used when the officer taps the Demo button) */
function demoData() {
  const g = (name, code, role) => ({ name, code, role, status: 'Absent', time: '', by: '' });
  return {
    guests: [
      g('Maria Santos', 'OP-1A2B', 'Student'), g('Juan Dela Cruz', 'OP-3C4D', 'Student'),
      g('Dr. Elena Reyes', 'OP-5E6F', 'Speaker'), g('Prof. Carlo Mendoza', 'OP-7H8J', 'Speaker'),
      g('Ana Villanueva', 'OP-9K2M', 'Officer'), g('Miguel Torres', 'OP-4N5P', 'Officer'),
      g('Liza Ramos', 'OP-6Q7R', 'Staff'), g('Ben Aquino', 'OP-8S9T', 'Staff'),
      g('Sofia Garcia', 'OP-2U3V', 'Guest'), g('Paolo Bautista', 'OP-5W6X', 'Guest')
    ],
    events: [
      { id: 'D1', title: 'General Assembly', date: plusDays(0), time: '14:00', venue: 'Main Auditorium', description: 'Semester kickoff and officer introductions.', active: true },
      { id: 'D2', title: 'Leadership Workshop', date: plusDays(7), time: '09:00', venue: 'Room 204', description: 'Bring your ID and a notebook.', active: false }
    ]
  };
}

/* ---------- Sound / haptics ---------- */
let actx;
function beep(ok = true) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.frequency.value = ok ? 880 : 300; g.gain.value = 0.12;
    o.start(); o.stop(actx.currentTime + (ok ? 0.12 : 0.25));
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 60, 80]);
}

/* ---------- Toast (with Undo) & banner ---------- */
let undoFn = null, toastTimer, bannerTimer;
function toast(msg, undo) {
  const t = $('#toast');
  undoFn = undo || null;
  t.innerHTML = `<div class="pop flex items-center gap-3 rounded-2xl px-4 py-3 shadow-xl" style="background:#1E2833;color:#fff">
    <span class="flex-1 text-base">${esc(msg)}</span>
    ${undo ? '<button data-act="undo" class="btn-gold rounded-xl px-4 py-2">Undo</button>' : ''}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.innerHTML = ''; undoFn = null; }, 5000);
}
function banner(kind, msg) {
  const styles = { ok: 'background:#15803D;color:#fff', warn: 'background:#F59E0B;color:#1E2833', err: 'background:#B91C1C;color:#fff' };
  $('#banner').innerHTML = `<div class="pop rounded-2xl px-4 py-3 font-semibold shadow-xl text-base" style="${styles[kind]}">${esc(msg)}</div>`;
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => { $('#banner').innerHTML = ''; }, 4000);
}

/* ---------- Sync with Google Sheets (offline queue) ---------- */
function enqueue(op) { if (!S.demo) S.queue.push(op); }
function commit() {
  ver++; save(); render();
  if (!S.demo && S.url) setTimeout(() => sync(false), 250);
}

async function api(method, body) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);
  try {
    const res = method === 'GET'
      ? await fetch(S.url + (S.url.includes('?') ? '&' : '?') + 'action=getAll&t=' + Date.now(), { signal: ctl.signal })
      : await fetch(S.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl.signal });
    let json;
    try { json = await res.json(); }
    catch (e) { throw new Error('Bad response — set the deployment access to "Anyone" and use the /exec URL.'); }
    if (!json.ok) throw new Error(json.error || 'Server error');
    return json;
  } finally { clearTimeout(timer); }
}

async function sync(manual) {
  if (S.demo || !S.url) { if (manual) toast('Demo mode is local only — connect a Sheet URL to sync.'); return; }
  if (syncing) return;
  if (!manual && document.hidden) return;
  if (!navigator.onLine) { netOk = false; renderHeader(); if (manual) toast('You are offline. Changes stay queued.'); return; }
  syncing = true; renderHeader();
  try {
    if (S.queue.length) {                       // 1) push queued changes
      const n = S.queue.length;
      await api('POST', { action: 'batch', ops: S.queue.slice(0, n) });
      S.queue.splice(0, n); save();
    }
    const v = ver;                              // 2) pull latest rows
    const data = await api('GET');
    if (!S.queue.length && v === ver) { S.guests = data.guests; S.events = data.events; }
    S.lastSync = Date.now(); netOk = true; save();
    if (manual) toast('Synced with Google Sheets.');
  } catch (e) {
    netOk = false;
    if (manual) toast('Sync failed: ' + e.message);
  } finally {
    syncing = false; render();
  }
}

/* ---------- Check-in actions ---------- */
function doCheckIn(g) {
  const time = new Date().toISOString();
  g.status = 'Present'; g.time = time; g.by = S.officer;
  enqueue({ action: 'checkin', code: g.code, time, by: S.officer });
  commit();
  const code = g.code;
  toast(`Checked in: ${g.name}`, () => {
    const x = findByCode(norm(code));
    if (x && x.status === 'Present') { x.status = 'Absent'; x.time = ''; x.by = ''; enqueue({ action: 'uncheck', code }); commit(); }
    $('#toast').innerHTML = '';
  });
}

/** Shared by manual taps and QR scans. Returns true if a new check-in happened. */
function checkInGuest(g, fromScan) {
  if (g.status === 'Present') {
    beep(false);
    banner('warn', `Already Checked In at ${fmtTime(g.time)} by ${g.by || 'an officer'}`);
    return false;
  }
  doCheckIn(g);
  beep(true);
  const offline = S.demo ? '' : (!navigator.onLine || !netOk ? ' (queued)' : '');
  banner('ok', `Checked In & Saved: ${g.name}${offline}`);
  return true;
}

function registerWalkIn({ name, code, role }, present = true) {
  const time = new Date().toISOString();
  const g = { name, code, role, status: present ? 'Present' : 'Absent', time: present ? time : '', by: present ? S.officer : '' };
  S.guests.push(g);
  enqueue({ action: 'addGuest', guest: Object.assign({}, g) });
  commit();
  return g;
}

/* ---------- QR scanner ---------- */
let scanner = null, lastScan = { t: '', at: 0 };

async function openScanner() {
  openModal(`<div class="w-full max-w-md card p-4">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-bold">Scan QR Pass</h2>
      <button data-act="closeModal" class="btn-line rounded-xl px-4 py-2">Close</button>
    </div>
    <div id="reader" class="rounded-2xl overflow-hidden min-h-[260px]" style="background:#1E2833"></div>
    <p id="scanMsg" class="text-[15px] mt-3" style="color:#475569">Point the camera at a QR pass. Scans check in automatically.</p></div>`);
  if (typeof Html5Qrcode === 'undefined') {
    $('#scanMsg').textContent = 'Scanner library not loaded. Open the app online once so it can be cached.';
    return;
  }
  try {
    scanner = new Html5Qrcode('reader');
    await scanner.start({ facingMode: 'environment' },
      { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
      onScan, () => {});
    if ($('#modal').classList.contains('hidden')) stopScanner();
  } catch (e) {
    scanner = null;
    const m = $('#scanMsg');
    if (m) m.textContent = 'Camera unavailable. Allow camera access (the app must be served over HTTPS).';
  }
}
async function stopScanner() {
  if (!scanner) return;
  const s = scanner; scanner = null;
  try { await s.stop(); s.clear(); } catch (e) {}
}
function onScan(text) {
  const now = Date.now();
  if (text === lastScan.t && now - lastScan.at < 3000) return;   // ignore repeat reads
  lastScan = { t: text, at: now };
  processScan(text);
}

/** Parse "Name | TicketCode | Role" or JSON {name, code|ticketCode, role}. */
function parseStructured(text) {
  try {
    const o = JSON.parse(text);
    if (o && typeof o === 'object' && o.name) {
      return { name: String(o.name).trim(), code: String(o.code || o.ticketCode || o.ticket || '').trim(), role: normRole(o.role) };
    }
  } catch (e) {}
  const parts = text.split('|').map((x) => x.trim());
  if (parts.length >= 2 && parts[0]) return { name: parts[0], code: parts[1], role: normRole(parts[2]) };
  return null;
}

function processScan(raw) {
  const text = String(raw || '').trim();
  if (!text) return;
  const known = findByCode(norm(text));
  if (known) { checkInGuest(known, true); return; }
  const p = parseStructured(text);
  if (p) {
    const existing = p.code && findByCode(norm(p.code));
    if (existing) { checkInGuest(existing, true); return; }
    const code = p.code || genCode();
    const g = registerWalkIn({ name: p.name, code, role: p.role }, true);
    beep(true);
    banner('ok', `Checked In & Saved: ${g.name} (walk-in)`);
    toast(`Walk-in added: ${g.name}`, () => {
      S.guests = S.guests.filter((x) => norm(x.code) !== norm(code));
      enqueue({ action: 'deleteGuest', code }); commit(); $('#toast').innerHTML = '';
    });
    return;
  }
  beep(false);
  banner('err', 'QR not recognised — not on the guest list.');
}

/* ---------- Search ---------- */
function search(q) {
  const raw = q.trim();
  if (!raw) return [];
  const code = norm(raw);
  const name = raw.toLowerCase().replace(/\s+/g, ' ');
  const words = name.split(' ');
  const out = [];
  for (const g of S.guests) {
    const gc = norm(g.code), gn = g.name.toLowerCase();
    let s = 0;
    if (gc === code) s = 100;
    else if (code.length >= 4 && gc.endsWith(code.slice(-4)) && code.length <= 4) s = 85;
    else if (code.length >= 2 && gc.includes(code)) s = 60;
    if (gn === name) s = Math.max(s, 90);
    else if (gn.includes(name)) s = Math.max(s, 50);
    else if (words.every((w) => gn.includes(w))) s = Math.max(s, 40);
    if (s) out.push([s, g]);
  }
  return out.sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name)).slice(0, 20).map((x) => x[1]);
}

/* ---------- Modal ---------- */
function openModal(html) { const m = $('#modal'); m.innerHTML = html; m.classList.remove('hidden'); }
function closeModal() { stopScanner(); const m = $('#modal'); m.classList.add('hidden'); m.innerHTML = ''; }

/* ---------- QR pass ---------- */
function openPass(code) {
  const g = findByCode(norm(code));
  if (!g) return;
  const ev = activeEvent();
  openModal(`<div class="w-full max-w-sm">
    <div class="rounded-3xl overflow-hidden shadow-2xl" style="background:#093D5E;color:#fff">
      <div class="px-5 py-3 flex items-center justify-between" style="background:#FFBE33;color:#1E2833">
        <b class="text-lg">OrgPass</b><span class="text-sm font-bold tracking-widest">ADMIT ONE</span>
      </div>
      <div class="p-5 text-center">
        <p class="text-[15px]" style="color:rgba(255,255,255,.85)">${esc(ev ? ev.title : 'Event Ticket')}</p>
        <h2 class="text-2xl font-bold mt-1 break-words">${esc(g.name)}</h2>
        <span class="inline-block mt-2 px-3 py-1 rounded-full text-sm font-bold" style="background:#FFBE33;color:#1E2833">${esc(g.role)}</span>
        <div><div id="qrBox" class="inline-block rounded-2xl p-3 mt-4" style="background:#fff"></div></div>
        <p class="font-mono text-xl tracking-widest mt-3 font-bold">${esc(g.code)}</p>
      </div>
    </div>
    <div class="grid gap-2 mt-3">

/* ---------- CSV ---------- */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
const csvCell = (v) => {
  let s = String(v ?? '');
  if (/^[=+\-@]/.test(s)) s = "'" + s;                 // block spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function downloadFile(name, text, type = 'text/csv;charset=utf-8') {
  const url = URL.createObjectURL(new Blob(['\uFEFF' + text], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
async function importCSV(file) {
  const rows = parseCSV(await file.text());
  if (!rows.length) { toast('That CSV is empty.'); return; }
  if (/name/i.test(rows[0][0] || '') && /(ticket|code)/i.test(rows[0][1] || 'code')) rows.shift();
  const fresh = []; let skipped = 0;
  const seen = new Set(S.guests.map((g) => norm(g.code)));
  for (const r of rows) {
    const name = (r[0] || '').trim();
    if (!name) { skipped++; continue; }
    let code = (r[1] || '').trim();
    if (!code) code = genCode();
    if (seen.has(norm(code))) { skipped++; continue; }
    seen.add(norm(code));
    fresh.push({ name, code, role: normRole(r[2]), status: 'Absent', time: '', by: '' });
  }
  if (fresh.length) { S.guests.push(...fresh); enqueue({ action: 'bulkAdd', guests: fresh }); commit(); }
  toast(`Imported ${fresh.length} guest${fresh.length === 1 ? '' : 's'}${skipped ? `, skipped ${skipped}` : ''}.`);
}
function exportCSV() {
  const lines = [['Name', 'TicketCode', 'Role', 'Status', 'CheckInTime', 'CheckedInBy'].join(',')];
  S.guests.forEach((g) => lines.push([g.name, g.code, g.role, g.status, g.time ? fmtStamp(g.time) : '', g.by].map(csvCell).join(',')));
  downloadFile(`OrgPass-attendance-${todayStr()}.csv`, lines.join('\r\n'));
}

const initials = (n) => {
  const p = String(n || '?').trim().split(/\s+/);
  return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
};
const ICON_CHECK = (s) => I('<path d="M20 6 9 17l-5-5"/>', s);
const ICON_CLOCK = (s) => I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', s);

/** Smooth curve through points (Catmull-Rom -> Bezier), clamped so it never dips outside the plot. */
function smoothPath(pts, yMin, yMax) {
  if (pts.length < 2) return '';
  const clamp = (v) => Math.min(yMax, Math.max(yMin, v));
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = clamp(p1[1] + (p2[1] - p0[1]) / 6);
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = clamp(p2[1] - (p3[1] - p1[1]) / 6);
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

/** Two smooth curves: Present (navy, gradient fill) vs Remaining (gold), like a crossing "performance" chart. */
function chartSvg(total, list) {
  const times = list.filter((g) => g.status === 'Present' && g.time).map((g) => new Date(g.time).getTime()).filter((n) => !isNaN(n)).sort((a, b) => a - b);
  if (times.length < 2) return `<p class="text-[15px] py-10 text-center" style="color:rgba(30,40,51,.6)">The chart appears once 2 guests in this group have checked in.</p>`;
  const W = 340, H = 224, P = { l: 46, r: 14, t: 18, b: 46 };
  const t0 = times[0], t1 = times[times.length - 1], span = Math.max(1, t1 - t0);
  const N = 12;
  const xs = Array.from({ length: N }, (_, i) => t0 + (span * i) / (N - 1));
  const present = xs.map((t) => times.filter((x) => x <= t).length);
  const maxY = Math.max(total, 1);
  const X = (t) => P.l + ((t - t0) / span) * (W - P.l - P.r);
  const Y = (v) => H - P.b - (v / maxY) * (H - P.t - P.b);
  const yTop = Y(maxY), yBot = Y(0);
  const pPts = xs.map((t, i) => [X(t), Y(present[i])]);
  const rPts = xs.map((t, i) => [X(t), Y(total - present[i])]);
  const pLine = smoothPath(pPts, yTop, yBot), rLine = smoothPath(rPts, yTop, yBot);
  const area = `${pLine} L${X(t1).toFixed(1)},${yBot} L${X(t0).toFixed(1)},${yBot} Z`;

  const yTicks = [0, 0.5, 1].map((f) => {
    const v = Math.round(maxY * f);
    return `<line x1="${P.l}" y1="${Y(v)}" x2="${W - P.r}" y2="${Y(v)}" stroke="rgba(9,61,94,.14)" stroke-width="1"/>
      <text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="rgba(30,40,51,.6)">${v}</text>`;
  }).join('');
  const xTicks = [0, 1, 2, 3].map((i) => {
    const t = t0 + (span * i) / 3, x = X(t);
    return `<line x1="${x.toFixed(1)}" y1="${yTop}" x2="${x.toFixed(1)}" y2="${yBot}" stroke="rgba(9,61,94,.14)" stroke-width="1" stroke-dasharray="3 4"/>
      <text x="${x.toFixed(1)}" y="${H - 28}" text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}" font-size="11" fill="rgba(30,40,51,.6)">${esc(fmtTime(new Date(t)))}</text>`;
  }).join('');

  const last = pPts[pPts.length - 1], lastVal = present[present.length - 1];
  const bw = 104, bx = Math.min(W - P.r - bw, Math.max(P.l, last[0] - bw / 2));
  const by = last[1] - 36 < 2 ? last[1] + 12 : last[1] - 36;
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" role="img" aria-label="Present and remaining over time">
    <defs><linearGradient id="gPresent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#093D5E" stop-opacity=".28"/><stop offset="100%" stop-color="#093D5E" stop-opacity="0"/></linearGradient></defs>
    ${yTicks}${xTicks}
    <path d="${area}" fill="url(#gPresent)"/>
    <path d="${rLine}" fill="none" stroke="#093D5E" stroke-opacity=".5" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
    <path d="${pLine}" fill="none" stroke="#093D5E" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="${last[0].toFixed(1)}" y1="${last[1].toFixed(1)}" x2="${last[0].toFixed(1)}" y2="${yBot}" stroke="#093D5E" stroke-opacity=".35" stroke-width="1.5"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="7" fill="#FFFFFF" stroke="#093D5E" stroke-width="3"/>
    <rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw}" height="24" rx="12" fill="#093D5E"/>
    <text x="${(bx + bw / 2).toFixed(1)}" y="${(by + 16).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Checked in ${lastVal}</text>
    <text transform="rotate(-90 11 ${((yTop + yBot) / 2).toFixed(1)})" x="11" y="${((yTop + yBot) / 2).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(30,40,51,.7)">Number of guests</text>
    <text x="${((P.l + W - P.r) / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(30,40,51,.7)">Check-in time</text>
  </svg>`;
}

    return `<button data-act="role" data-role="${r}" class="shrink-0 rounded-full px-4 py-2 text-[15px] font-semibold" style="${on ? 'background:#093D5E;color:#fff' : 'background:#fff;color:#1E2833;border:1.5px solid #CBD5E1'}">${r === 'All' ? 'All' : PLURAL[r]} ${count(r)}</button>`;
  }).join('');
  const seg = ['All', 'Present', 'Absent'].map((s) => `<button data-act="status" data-status="${s}" class="flex-1 rounded-lg py-2 text-[15px] font-semibold" style="${statusFilter === s ? 'background:#093D5E;color:#fff' : 'color:#1E2833'}">${s}</button>`).join('');
  let list = S.guests.filter((g) => (roleFilter === 'All' || g.role === roleFilter) && (statusFilter === 'All' || g.status === statusFilter));
  list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
  const shown = list.slice(0, attLimit);
  el.innerHTML = `
    <div class="flex gap-2 overflow-x-auto hide-scroll pb-2 -mx-4 px-4">${pills}</div>
    <div class="flex p-1 rounded-xl mt-2" style="background:#E2E8F0">${seg}</div>
    <div class="grid gap-3 mt-4">
      ${shown.map((g) => `<div class="card p-3 flex items-center gap-3">
        <div class="min-w-0 flex-1">
          <div class="font-bold truncate">${esc(g.name)}</div>
          <div class="font-mono text-[14px]" style="color:#475569">${esc(g.code)}</div>
          <div class="flex flex-wrap gap-1.5 mt-1.5">${roleTag(g.role)}${guestStatusBadge(g)}</div>
        </div>
        <button data-act="qr" data-code="${esc(g.code)}" class="btn-navy rounded-xl px-3 py-2 flex items-center gap-1.5 text-[15px]" aria-label="QR Pass for ${esc(g.name)}">${IC.qr(20)}<span>QR Pass</span></button>
      </div>`).join('') || `<p class="text-center py-10" style="color:#64748B">${S.guests.length ? 'No attendees match these filters.' : 'No guests yet. Import a CSV or register walk-ins from the More tab.'}</p>`}
      ${list.length > shown.length ? `<button data-act="moreRows" class="btn-line rounded-xl py-3">Show more (${list.length - shown.length} left)</button>` : ''}
    </div>`;
}

/* ----- Check-in ----- */

        <div class="relative flex-1">
          <span class="absolute left-3 top-1/2 -translate-y-1/2" style="color:#64748B">${IC.search(20)}</span>

          <button id="clearQ" data-act="clear" class="absolute right-2 top-1/2 -translate-y-1/2 hidden rounded-full p-1.5" style="background:#E2E8F0;color:#1E2833" aria-label="Clear">${IC.x(18)}</button>

        <button data-act="scan" class="btn-gold rounded-2xl flex items-center justify-center" style="width:56px;height:56px" aria-label="Scan QR code">${IC.camera(28)}</button>

function updateClear() { const b = $('#clearQ'); if (b) b.classList.toggle('hidden', !query); }

function renderResults() {
  const el = $('#results'); if (!el) return;
  if (!query.trim()) {
    const left = S.guests.filter((g) => g.status !== 'Present').length;
    el.innerHTML = `<p class="text-center py-8" style="color:#64748B">${S.guests.length ? `${left} guest${left === 1 ? '' : 's'} still to arrive.` : 'No guests loaded yet.'}</p>`;
    return;
  }
  const res = search(query);
  if (!res.length) {
    el.innerHTML = `<div class="card p-4 text-center"><p class="font-semibold">No match for “${esc(query.trim())}”</p>
      <button data-act="walkinFor" class="btn-navy rounded-xl px-4 py-2 mt-3">Register as walk-in</button></div>`;
    return;
  }
  el.innerHTML = res.map((g) => `<div class="card p-3 flex items-center gap-3">

      <div class="font-bold text-lg truncate">${esc(g.name)}</div>
      <div class="font-mono text-[14px]" style="color:#475569">${esc(g.code)}</div>
      <div class="flex flex-wrap gap-1.5 mt-1.5">${roleTag(g.role)}${g.status === 'Present' ? `<span class="inline-block rounded-full px-2.5 py-0.5 text-[13px] font-bold" style="background:#F59E0B;color:#1E2833">In at ${esc(fmtTime(g.time))} by ${esc(g.by || '—')}</span>` : ''}</div>

      ? `<button data-act="checkin" data-code="${esc(g.code)}" class="rounded-xl px-4 py-3 font-semibold" style="background:#E2E8F0;color:#475569">Checked in</button>`
      : `<button data-act="checkin" data-code="${esc(g.code)}" class="btn-gold rounded-xl px-4 py-3">Check In</button>`}

}

        <button data-act="delEvent" data-id="${esc(e.id)}" class="btn-line rounded-xl px-4 py-2.5" style="color:#B91C1C">Delete</button>

}

/* ---------- Setup / login screen ---------- */
function showSetup(msg, allowForce) {
  const s = $('#setup');
  s.classList.remove('hidden');
  s.innerHTML = `<div class="min-h-full flex items-center justify-center p-5">
    <div class="w-full max-w-md">
      <div class="text-center mb-5">
        <svg width="76" height="76" viewBox="0 0 512 512" class="mx-auto" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#FFFFFF" fill-opacity=".12"/><path d="M96 176a32 32 0 0 1 32-32h256a32 32 0 0 1 32 32v40a40 40 0 0 0 0 80v40a32 32 0 0 1-32 32H128a32 32 0 0 1-32-32v-40a40 40 0 0 0 0-80z" fill="#FFBE33"/><path d="M196 256l44 44 80-88" fill="none" stroke="#1E2833" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h1 class="text-3xl font-extrabold mt-2" style="color:#fff">OrgPass</h1>
        <p style="color:rgba(255,255,255,.85)">Officer check-in</p>
      </div>
      <div id="setupInstall"></div>
      <form id="setupForm" class="card p-5 grid gap-3">
        <label class="font-semibold" for="sName">Officer Name</label>
        <input id="sName" class="field" required maxlength="60" placeholder="e.g. Ana Villanueva" value="${esc(S.officer)}" autocomplete="name">
        <label class="font-semibold" for="sUrl">Google Apps Script Web App URL</label>
        <input id="sUrl" class="field" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.demo ? '' : S.url)}">
        ${msg ? `<p class="text-[15px] font-semibold" style="color:#B91C1C">${esc(msg)}</p>` : ''}
        <button class="btn-gold rounded-xl py-3" type="submit">Connect &amp; Start</button>
        ${allowForce ? '<button type="button" data-act="forceSetup" class="btn-line rounded-xl py-3">Continue anyway (offline)</button>' : ''}
        <div class="text-center text-[14px]" style="color:#64748B">— or —</div>
        <button type="button" data-act="demo" class="btn-navy rounded-xl py-3">Demo / Offline Mode (10 sample guests)</button>
      </form>
      <p class="text-center text-[14px] mt-4" style="color:rgba(255,255,255,.75)">The URL is saved on this device, so you only paste it once.</p>
    </div></div>`;
  renderInstall();
}
function hideSetup() { $('#setup').classList.add('hidden'); $('#setup').innerHTML = ''; }

function applyLogin({ name, url, demo }) {
  if (S.queue.length && (demo || url !== S.url) && !confirm('You have unsynced changes. Switching will discard them. Continue?')) return false;
  const changed = demo || S.demo || url !== S.url;
  S.officer = name; S.demo = demo; S.url = demo ? '' : url;
  if (changed) { S.guests = []; S.events = []; S.queue = []; S.lastSync = 0; }
  if (demo) { const d = demoData(); S.guests = d.guests; S.events = d.events; }
  netOk = true; save(); hideSetup(); showTab('dashboard');
  if (!demo) sync(true);
  return true;
}

async function connectFromForm(force) {
  const name = $('#sName').value.trim();
  const url = $('#sUrl').value.trim();
  if (!name) return;
  if (!/^https:\/\/script\.google\.com\/.+/.test(url)) { showSetup('Paste the Web App URL that ends in /exec (it starts with https://script.google.com).', false); $('#sName').value = name; return; }
  if (!force) {
    const prev = S.url; S.url = url;
    try { await api('GET'); }
    catch (e) { S.url = prev; showSetup('Could not reach the Sheet: ' + e.message, true); $('#sName').value = name; $('#sUrl').value = url; return; }
    S.url = prev;
  }
  applyLogin({ name, url, demo: false });
}

/* ---------- Events: delegated clicks, inputs, submits ---------- */
document.addEventListener('click', (e) => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'tab': showTab(d.tab); break;
    case 'role': roleFilter = d.role; attLimit = 100; renderAttendees(); break;
    case 'status': statusFilter = d.status; attLimit = 100; renderAttendees(); break;
    case 'moreRows': attLimit += 100; renderAttendees(); break;
    case 'install': doInstall(); break;
    case 'installX': installDismissed = true; try { sessionStorage.setItem('op_inst_x', '1'); } catch (e) {} renderInstall(); break;
    case 'copyLink':
      (navigator.clipboard ? navigator.clipboard.writeText(location.href) : Promise.reject()).then(() => toast('Link copied. Paste it in Chrome or Safari.')).catch(() => toast(location.href));
      break;
    case 'dashRole': dashRole = d.role; renderDashboard(); break;
    case 'viewPresent': roleFilter = 'All'; statusFilter = 'Present'; attLimit = 100; showTab('attendees'); break;
    case 'qr': openPass(d.code); break;
    case 'dlPass': downloadPass(d.code); break;
    case 'closeModal': closeModal(); break;
    case 'scan': openScanner(); break;
    case 'clear': query = ''; $('#q').value = ''; updateClear(); renderResults(); $('#q').focus(); break;
    case 'checkin': { const g = findByCode(norm(d.code)); if (g) checkInGuest(g, false); break; }
    case 'undo': if (undoFn) { const f = undoFn; undoFn = null; f(); } break;
    case 'walkinFor': walkinPrefill = query.trim(); showTab('more'); break;
    case 'toggleForm': formOpen = !formOpen; showTab('announce'); break;
    case 'setActive':
      S.events.forEach((x) => { x.active = x.id === d.id; });
      enqueue({ action: 'setActive', id: d.id }); commit(); break;
    case 'delEvent':
      if (confirm('Delete this event?')) { S.events = S.events.filter((x) => x.id !== d.id); enqueue({ action: 'deleteEvent', id: d.id }); commit(); }
      break;
    case 'regen': $('#wcode').value = genCode(); break;
    case 'sync': sync(true); break;
    case 'import': $('#csvFile').click(); break;
    case 'sample': downloadFile('OrgPass-sample.csv', 'Name,TicketCode,Role\r\nMaria Santos,OP-1A2B,Student\r\nDr. Elena Reyes,OP-5E6F,Speaker\r\nLiza Ramos,OP-6Q7R,Staff\r\n'); break;
    case 'export': exportCSV(); break;
    case 'switch': showSetup('', false); break;
    case 'reset': openResetModal(); break;
    case 'confirmReset':
      if ($('#delInput').value.trim() === 'DELETE') {
        S.guests = []; enqueue({ action: 'reset' }); commit(); closeModal(); toast('Guest list cleared.');
      } else { $('#delInput').focus(); }
      break;
    case 'demo': applyLogin({ name: ($('#sName').value.trim() || 'Demo Officer'), url: '', demo: true }); break;
    case 'forceSetup': connectFromForm(true); break;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { query = e.target.value; updateClear(); renderResults(); }
  if (e.target.id === 'delInput') { $('#delBtn').disabled = e.target.value.trim() !== 'DELETE'; $('#delBtn').style.opacity = e.target.value.trim() === 'DELETE' ? 1 : .45; }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'q') {
    const res = search(query);
    if (res.length === 1) { checkInGuest(res[0], false); }
    else if (res.length > 1 && norm(res[0].code) === norm(query)) { checkInGuest(res[0], false); }
  }
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal();
});

document.addEventListener('change', async (e) => {
  if (e.target.id === 'csvFile' && e.target.files[0]) {
    try { await importCSV(e.target.files[0]); } catch (err) { toast('Could not read that CSV.'); }
    e.target.value = '';
  }
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'setupForm') connectFromForm(false);
  else if (f.id === 'walkinForm') {
    const name = $('#wname').value.trim(); if (!name) return;
    let code = $('#wcode').value;
    if (findByCode(norm(code))) code = genCode();
    const g = registerWalkIn({ name, code, role: $('#wrole').value }, true);
    beep(true);
    $('#wname').value = ''; $('#wcode').value = genCode();
    toast(`Registered & checked in: ${g.name}`);
    openPass(g.code);
  } else if (f.id === 'eventForm') {
    const v = Object.fromEntries(new FormData(f));
    const ev = { id: 'E' + Date.now().toString(36), title: v.title.trim(), date: v.date, time: v.time, venue: (v.venue || '').trim(), description: (v.description || '').trim(), active: false };
    S.events.push(ev);
    enqueue({ action: 'addEvent', event: ev });
    formOpen = false; commit(); showTab('announce'); toast('Event posted.');
  }
});

function openResetModal() {
  openModal(`<div class="w-full max-w-sm card p-5">
    <h2 class="text-lg font-bold" style="color:#B91C1C">Reset guest list?</h2>
    <p class="mt-2 text-base">This removes all ${S.guests.length} guests from this device and the Google Sheet. Type <b>DELETE</b> to confirm.</p>
    <input id="delInput" class="field mt-3" autocomplete="off" autocapitalize="characters" placeholder="DELETE">
    <div class="grid grid-cols-2 gap-2 mt-4">
      <button data-act="closeModal" class="btn-line rounded-xl py-3">Cancel</button>
      <button id="delBtn" data-act="confirmReset" class="rounded-xl py-3 font-bold" style="background:#B91C1C;color:#fff;opacity:.45" disabled>Delete all</button>
    </div></div>`);
  setTimeout(() => $('#delInput') && $('#delInput').focus(), 50);
}

/* ---------- Install app (PWA) ---------- */
let deferredPrompt = null, installDismissed = false;
try { installDismissed = sessionStorage.getItem('op_inst_x') === '1'; } catch (e) {}
const UA = navigator.userAgent || '';
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = () => /Android/i.test(UA);
const isInApp = () => /FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|Snapchat|TikTok|MicroMessenger/i.test(UA);

function installCard(canDismiss) {
  if (isStandalone()) return '';
  let title, text, action = '';
  if (isInApp()) {
    title = 'Open in Chrome or Safari';
    text = 'This in-app browser blocks the camera and installing. Copy the link and open it in Chrome (Android) or Safari (iPhone).';
    action = '<button data-act="copyLink" class="btn-gold rounded-xl px-5 py-2.5 mt-2">Copy link</button>';
  } else if (deferredPrompt) {
    title = 'Install OrgPass';
    text = 'Get the app on your home screen. Works offline.';
    action = '<button data-act="install" class="btn-gold rounded-xl px-5 py-2.5 mt-2">Install App</button>';
  } else if (isIOS()) {
    title = 'Install OrgPass on iPhone';
    text = 'Tap the Share button in Safari, then choose “Add to Home Screen”.';
  } else if (isAndroid()) {
    title = 'Install OrgPass';
    text = 'Tap the browser menu (⋮), then “Install app” or “Add to Home screen”.';
  } else return '';
  return `<div class="card p-4 mb-4 flex items-start gap-3" style="border-radius:20px">
    <svg width="46" height="46" viewBox="0 0 512 512" class="shrink-0" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#093D5E"/><path d="M96 176a32 32 0 0 1 32-32h256a32 32 0 0 1 32 32v40a40 40 0 0 0 0 80v40a32 32 0 0 1-32 32H128a32 32 0 0 1-32-32v-40a40 40 0 0 0 0-80z" fill="#FFBE33"/><path d="M196 256l44 44 80-88" fill="none" stroke="#1E2833" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="min-w-0 flex-1"><div class="font-bold text-lg" style="color:#1E2833">${title}</div>
      <p class="text-[15px]" style="color:rgba(30,40,51,.75)">${text}</p>${action}</div>
    ${canDismiss ? '<button data-act="installX" aria-label="Hide" class="rounded-full p-1.5 shrink-0" style="background:rgba(9,61,94,.08);color:#1E2833">' + IC.x(18) + '</button>' : ''}</div>`;
}
function renderInstall() {
  const slot = $('#installSlot');
  if (slot) slot.innerHTML = tab === 'more' ? installCard(false) : (tab === 'dashboard' && !installDismissed ? installCard(true) : '');
  const s = $('#setupInstall');
  if (s) s.innerHTML = installCard(false) ? installCard(false).replace('mb-4', 'mb-4 shadow-xl') : '';
}
async function doInstall() {
  if (!deferredPrompt) return;
  const p = deferredPrompt; deferredPrompt = null;
  try { p.prompt(); await p.userChoice; } catch (e) {}
  renderInstall();
}
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; renderInstall(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; renderInstall(); toast('OrgPass installed. Open it from your home screen.'); });

/* ---------- Boot ---------- */
window.addEventListener('online', () => { netOk = true; renderHeader(); sync(false); });
window.addEventListener('offline', () => { netOk = false; renderHeader(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(false); });
setInterval(() => sync(false), 10000);          // background sync while online

// iOS ignores SVG home-screen icons, so draw a PNG one at runtime.
(function makeAppleIcon() {
  try {
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='#093D5E'/><path d='M96 176a32 32 0 0 1 32-32h256a32 32 0 0 1 32 32v40a40 40 0 0 0 0 80v40a32 32 0 0 1-32 32H128a32 32 0 0 1-32-32v-40a40 40 0 0 0 0-80z' fill='#FFBE33'/><path d='M196 256l44 44 80-88' fill='none' stroke='#1E2833' stroke-width='36' stroke-linecap='round' stroke-linejoin='round'/></svg>";
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 180;
      c.getContext('2d').drawImage(img, 0, 0, 180, 180);
      const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
      document.head.appendChild(l);
    };
    img.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
  } catch (e) {}
})();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

renderNav();
renderHeader();
if (!S.officer) { showSetup('', false); }
else { showTab('dashboard'); sync(false); }
</script>
